append_system_prompt:
  - |
    默认使用中文。你是 Open-AutoGLM 项目的资深 pair-programmer，先读本仓库事实，再按需加载规则；不要把配置提示词当作架构文档。TraeCLI 2.0 会加载项目 `AGENTS.md`、`.trae/rules/`、`.trae/skills/`、`.trae/agents/` 等资源；本文件只保留项目级行为入口和少量强约束，详细协议以对应文件为准。
    项目规则按需加载：涉及 LangGraph State/Node/Edge/Tool/HITL 或核心 Agent loop 变更时读取 `.trae/rules/graph.mdc` 与 `.trae/rules/architecture.mdc`；涉及 roadmap、实现计划、架构审查或 Planner-Architect-Critic 流程时读取 `.trae/rules/ralplan.mdc`；涉及 Autopilot 持续执行时读取 `.trae/rules/autopilot.mdc`。普通任务不要主动加载重型设计流程。

    # Output Style Constraints (Claude-Mode)
    - Brevity is very important as a default. You MUST be extremely concise (i.e. no more than 5-10 lines for summaries).
    - Be concise and factual — NO filler, NO conversational commentary, and NO unnecessary repetition.
    - Skip heavy formatting for single, simple actions or confirmations. Respond in plain sentences.
    - Preamble messages (before tool calls) must be no more than 1 sentence (8–12 words).
    - Do NOT excessively explain your work, your thought process, or the tools you are using unless explicitly asked.
    - Do NOT add inline comments within code unless explicitly requested.
    - Omit greetings, pleasantries, and concluding offers for further help.

    项目命令：执行 Python、pytest、pip 优先使用 `.venv/bin/python`、`.venv/bin/pytest`、`.venv/bin/pip`，避免默认使用系统 Python。文件搜索优先用 `rg` / `rg --files`。
    联网研究：默认使用项目级 skill `smart-search-cli` 与本机 `smart-search` CLI；需要第三方库/API 文档时优先用 Context7。不要使用 TraeCLI 内置 WebSearch/WebFetch，除非用户明确要求或 smart-search 不可用。
    实机诊断：用户要求 Open-AutoGLM/PhoneAgent 实机测试、监看实际效果、源码归因、修改建议或交互式 HTML 报告时，使用 `.trae/skills/phone-agent-live-diagnosis/SKILL.md`；默认入口为 `.venv/bin/python .trae/skills/phone-agent-live-diagnosis/scripts/run_diagnosis.py "<测试目标>"`。
    提权协议：重要命令因 sandbox、网络、GPU/Metal、ADB 设备访问、用户级配置写入或 `Operation not permitted` 失败时，用 TraeCLI 2.0 工具参数 `sandbox_permissions="require_escalated"` 重跑，并填写用户可读 `justification`；非破坏、可复用命令才设置窄 `prefix_rule`。不要只用自然语言提示提权；不要为 `rm`、`git reset` 等破坏性命令设置 `prefix_rule`。
    PhoneAgent 强约束摘要：模型输出协议仅支持 `json_schema|tool_calls|auto`，默认 `json_schema`；`prompt_version` 仅支持 `context_harness_v1`；`context_mode` 默认 `inject`；不得恢复旧 text DSL。坐标统一 0-1000 相对坐标，执行前必须转换；历史图片必须剥离；支付/隐私走 confirm，登录/验证码走 takeover。
    Grounding 摘要：runtime 只执行 `target_mark_id -> MarkRegistry -> ActionIR`；LocateAnything/Fake/OCR/UIAutomator/SoM 只能生成 marks，不能把 `target_text_hint` 当可执行目标。默认 `PHONE_AGENT_GROUNDING_PROVIDER=hybrid`，accessibility tree 优先，失败再 fallback LocateAnything。Grounding benchmark 入口在 `bench/grounding/`，输出目录 `bench_output/` 默认不提交。

disallowed_tools:
  - "WebSearch"
  - "WebFetch"

hooks:
  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      if [ "$tool" = "TaskUpdate" ]; then
        status=$(echo "$input" | jq -r '.tool_input.status // empty')
        if [ "$status" = "completed" ]; then
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"任务已标记完成。如当前 Phase 已结束，请先更新 .trae/rules/graph.mdc 的 Roadmap section（标记 Phase ✅）；若改动架构/API/评测/trace，同步更新 README.md、docs/future-roadmap.md、AGENTS.md；然后按 AGENTS.md 的 Version Management 规范决定是否 commit。"}}'
        fi
      fi
    matchers:
      - event: post_tool_use
        tool: '^TaskUpdate$'

  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        .trae/rules/graph.mdc)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"检测到 .trae/rules/graph.mdc 已更新。如果这是 RALPLAN roadmap 变更，下一步应调用 architect 审查，然后调用 critic 给出 APPROVE / ITERATE / REJECT；Critic 未 APPROVE 前不要进入实现。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: post_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        phone_agent/agent.py|phone_agent/graph/*.py|phone_agent/graph/*/*.py|evals/*.py)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"你正在修改核心 Agent loop / LangGraph / Eval 文件。若本次是架构级变更，请先确认 .trae/rules/graph.mdc 的 RALPLAN Status 为 critic_approved 且 approved_for_execution=true；完成后同步 README.md、docs/future-roadmap.md、AGENTS.md 中的架构/API/trace 说明。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      command=$(echo "$input" | jq -r '.tool_input.command // empty')
      case "$command" in
        *python*|*pytest*|*pip*)
          case "$command" in
            *.venv/bin/*|*source\ .venv/bin/activate*|*.\ .venv/bin/activate*)
              ;;
            *)
              printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"本项目使用项目虚拟环境 .venv。执行 Python / pytest / pip 命令时请优先改用 .venv/bin/python、.venv/bin/pytest、.venv/bin/pip，或先 source .venv/bin/activate；不要默认使用系统 Python。"}}'
              ;;
          esac
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: '^Bash$'

  - type: command
    command: |
      input=$(cat)
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      if [ -x "$workspace/.venv/bin/python" ]; then
        py="$workspace/.venv/bin/python"
      else
        py="python3"
      fi
      output=$(printf '%s' "$input" | "$py" "$workspace/.trae/hooks/ralplan.py")
      if [ -n "$output" ]; then
        printf '%s\n' "$output"
        exit 0
      fi
      printf '%s' "$input" | "$py" "$workspace/.trae/hooks/autopilot.py"
    timeout: "10s"
    matchers:
      - event: user_prompt_submit
      - event: stop
      - event: subagent_start
      - event: subagent_stop

mcp_servers:
  - name: Context7
    type: stdio
    command: bunx
    args:
      - "-y"
      - "@upstash/context7-mcp@latest"
  - name: python-lsp
    type: stdio
    command: uvx
    args:
      - "python-lsp-mcp@latest"
