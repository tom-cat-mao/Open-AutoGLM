append_system_prompt:
  - |
    默认使用中文。你是本项目的资深 pair-programmer，优先保持上下文节制和按需加载。项目规则按需加载：涉及 LangGraph State/Node/Edge/Tool/HITL 或核心 Agent loop 变更时读取 `.trae/rules/graph.mdc` 与 `.trae/rules/architecture.mdc`；涉及 roadmap、实现计划、架构审查或 Plan-Architect-Critic 流程时读取 `.trae/rules/ralplan.mdc`。普通任务不要主动加载重型设计流程。执行 Python、pytest、pip 等项目命令时优先使用项目虚拟环境 `.venv`（如 `.venv/bin/python`、`.venv/bin/pytest`、`.venv/bin/pip`），避免使用系统 Python。

    # Output Style Constraints (Claude-Mode)
    - Brevity is very important as a default. You MUST be extremely concise (i.e. no more than 5-10 lines for summaries).
    - Be concise and factual — NO filler, NO conversational commentary, and NO unnecessary repetition.
    - Skip heavy formatting for single, simple actions or confirmations. Respond in plain sentences.
    - Preamble messages (before tool calls) must be no more than 1 sentence (8–12 words).
    - Do NOT excessively explain your work, your thought process, or the tools you are using unless explicitly asked.
    - Do NOT add inline comments within code unless explicitly requested.
    - Omit greetings, pleasantries, and concluding offers for further help.

    联网搜索：默认使用项目级 skill `smart-search-cli`，通过本机 `smart-search` CLI 执行搜索、抓取和证据收集；不要使用 TraeCLI 内置 WebSearch。需要打开具体 URL 时，优先使用 `smart-search fetch`，必要时才使用 WebFetch。

disallowed_tools:
  - "WebSearch"

hooks:
  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      if [ "$tool" = "TaskUpdate" ]; then
        status=$(echo "$input" | jq -r '.tool_input.status // empty')
        if [ "$status" = "completed" ]; then
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"任务已标记完成。如当前 Phase 已结束，请先更新 .trae/rules/graph.mdc 的 Roadmap section（标记 Phase ✅）；若改动架构/API/评测/trace，同步更新 README.md、docs/future-roadmap.md、AGENTS.md；然后按 AGENTS.md 的 Version Management 规范决定是否 commit。"}}'
        fi
      fi
    matchers:
      - event: post_tool_use
        tool: '^TaskUpdate$'

  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        .trae/rules/graph.mdc)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"检测到 .trae/rules/graph.mdc 已更新。如果这是 RALPLAN roadmap 变更，下一步应调用 architect 审查，然后调用 critic 给出 APPROVE / ITERATE / REJECT；Critic 未 APPROVE 前不要进入实现。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: post_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        phone_agent/agent.py|phone_agent/graph/*.py|phone_agent/graph/*/*.py|evals/*.py)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"你正在修改核心 Agent loop / LangGraph / Eval 文件。若本次是架构级变更，请先确认 .trae/rules/graph.mdc 的 RALPLAN Status 为 critic_approved 且 approved_for_execution=true；完成后同步 README.md、docs/future-roadmap.md、AGENTS.md 中的架构/API/trace 说明。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      command=$(echo "$input" | jq -r '.tool_input.command // empty')
      case "$command" in
        *python*|*pytest*|*pip*)
          case "$command" in
            *.venv/bin/*|*source\ .venv/bin/activate*|*.\ .venv/bin/activate*)
              ;;
            *)
              printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"本项目使用项目虚拟环境 .venv。执行 Python / pytest / pip 命令时请优先改用 .venv/bin/python、.venv/bin/pytest、.venv/bin/pip，或先 source .venv/bin/activate；不要默认使用系统 Python。"}}'
              ;;
          esac
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: '^Bash$'

  - type: command
    command: |
      input=$(cat)
      workspace=$(printf '%s' "$input" | jq -r '.cwd // empty')
      if [ -z "$workspace" ]; then
        workspace="${workspaceFolder}"
      fi
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      if [ -x "$workspace/.venv/bin/python" ]; then
        py="$workspace/.venv/bin/python"
      else
        py="python3"
      fi
      output=$(printf '%s' "$input" | "$py" "$workspace/.trae/hooks/ralplan.py")
      if [ -n "$output" ]; then
        printf '%s\n' "$output"
        exit 0
      fi
      printf '%s' "$input" | "$py" "$workspace/.trae/hooks/autopilot.py"
    timeout: "10s"
    matchers:
      - event: user_prompt_submit
      - event: stop
      - event: subagent_start
      - event: subagent_stop

