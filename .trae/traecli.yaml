append_system_prompt:
  - |
    默认使用中文。你是本项目的资深 pair-programmer，优先保持上下文节制和按需加载。项目规则按需加载：涉及 LangGraph State/Node/Edge/Tool/HITL 或核心 Agent loop 变更时读取 `.trae/rules/graph.mdc` 与 `.trae/rules/architecture.mdc`；涉及 roadmap、实现计划、架构审查或 Plan-Architect-Critic 流程时读取 `.trae/rules/design-loop.mdc`。普通任务不要主动加载重型设计流程。执行 Python、pytest、pip 等项目命令时优先使用项目虚拟环境 `.venv`（如 `.venv/bin/python`、`.venv/bin/pytest`、`.venv/bin/pip`），避免使用系统 Python。

    输出风格：默认简洁，先给结论；能用表格就用表格；避免冗长背景、重复解释和大段散文；除非用户要求，不展开过长推理；复杂内容用短表格 + 简短要点。

    联网搜索：默认使用项目级 skill `smart-search-cli`，通过本机 `smart-search` CLI 执行搜索、抓取和证据收集；不要使用 TraeCLI 内置 WebSearch。需要打开具体 URL 时，优先使用 `smart-search fetch`，必要时才使用 WebFetch。

disallowed_tools:
  - "WebSearch"

hooks:
  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      if [ "$tool" = "TaskUpdate" ]; then
        status=$(echo "$input" | jq -r '.tool_input.status // empty')
        if [ "$status" = "completed" ]; then
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"任务已标记完成。如当前 Phase 已结束，请先更新 .trae/rules/graph.mdc 的 Roadmap section（标记 Phase ✅），然后按 AGENTS.md 的 Version Management 规范执行 git commit。"}}'
        fi
      fi
    matchers:
      - event: post_tool_use
        tool: '^TaskUpdate$'

  - type: command
    command: |
      input=$(cat)
      tool=$(echo "$input" | jq -r '.tool_name // empty')
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace="${workspaceFolder}"
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        .trae/rules/graph.mdc)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"检测到 .trae/rules/graph.mdc 已更新。如果这是 design-loop roadmap 变更，下一步应调用 architect 审查，然后调用 critic 给出 APPROVE / ITERATE / REJECT；Critic 未 APPROVE 前不要进入实现。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: post_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      file=$(echo "$input" | jq -r '.tool_input.file_path // .tool_input.path // empty')
      workspace="${workspaceFolder}"
      if [ -z "$workspace" ]; then
        workspace=$(pwd)
      fi
      case "$file" in
        "$workspace"/*)
          rel="${file#$workspace/}"
          ;;
        *)
          rel="$file"
          ;;
      esac
      case "$rel" in
        phone_agent/agent.py|phone_agent/graph/*.py|phone_agent/graph/*/*.py)
          printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"你正在修改核心 Agent loop / LangGraph 文件。若本次是架构级变更，请先确认 .trae/rules/graph.mdc 的 Design Loop Status 为 critic_approved 且 approved_for_execution=true；否则应先运行 /design-loop。"}}'
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: 'Write|Edit|MultiEdit'

  - type: command
    command: |
      input=$(cat)
      command=$(echo "$input" | jq -r '.tool_input.command // empty')
      case "$command" in
        *python*|*pytest*|*pip*)
          case "$command" in
            *.venv/bin/*|*source\ .venv/bin/activate*|*.\ .venv/bin/activate*)
              ;;
            *)
              printf '%s\n' '{"hookSpecificOutput":{"additionalContext":"本项目使用项目虚拟环境 .venv。执行 Python / pytest / pip 命令时请优先改用 .venv/bin/python、.venv/bin/pytest、.venv/bin/pip，或先 source .venv/bin/activate；不要默认使用系统 Python。"}}'
              ;;
          esac
          ;;
      esac
    timeout: "5s"
    matchers:
      - event: pre_tool_use
        tool: '^Bash$'

